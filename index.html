<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доска публикаций</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>Доска публикаций</h1>

    <!-- Кнопка загрузки -->
    <button id="load-btn" class="primary">Загрузить публикации</button>

    <!-- Область сообщений -->
    <p id="message" class="message" role="status"></p>

    <!-- Список публикаций -->
    <section id="posts" class="posts"></section>

    <!-- Форма создания -->
    <form id="post-form" novalidate>
      <h2>Создать публикацию</h2>
      <div class="field">
        <label for="title">Заголовок *</label>
        <input type="text" id="title" placeholder="Введите заголовок">
      </div>
      <div class="field">
        <label for="body">Текст *</label>
        <textarea id="body" rows="4" placeholder="Введите текст публикации"></textarea>
      </div>
      <button type="submit" class="primary">Создать публикацию</button>
      <p id="form-error" class="error" role="alert"></p>
    </form>
  </div>
</body>
</html>
